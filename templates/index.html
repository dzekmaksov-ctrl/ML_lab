<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Прогнозирование жилья (California Housing)</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 450px; }
        .input-group { margin-bottom: 10px; }
        label { font-size: 12px; color: #94a3b8; display: block; margin-bottom: 3px; }
        input, button { width: 100%; padding: 8px; box-sizing: border-box; border: 1px: solid #475569; border-radius: 6px; background: #0f172a; color: #fff; }
        input { border: 1px solid #475569; }
        button { background: #3b82f6; border: none; cursor: pointer; font-weight: bold; margin-top: 15px; padding: 10px; }
        button:hover { background: #2563eb; }
        .result { margin-top: 20px; background: #334155; padding: 15px; border-radius: 6px; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Прогноз стоимости жилья</h2>
        <p style="font-size: 12px; color: #94a3b8;">Модель на базе California Housing (Регрессия + Классификация)</p>

        <form id="form">
            <div class="input-group"><label>MedInc (Медианный доход в районе):</label><input type="number" step="any" id="f0" value="8.3252"></div>
            <div class="input-group"><label>HouseAge (Возраст дома):</label><input type="number" step="any" id="f1" value="41.0"></div>
            <div class="input-group"><label>AveRooms (Среднее кол-во комнат):</label><input type="number" step="any" id="f2" value="6.984"></div>
            <div class="input-group"><label>AveBedrms (Среднее кол-во спален):</label><input type="number" step="any" id="f3" value="1.023"></div>
            <div class="input-group"><label>Population (Население района):</label><input type="number" step="any" id="f4" value="322.0"></div>
            <div class="input-group"><label>AveOccup (Среднее число жильцов):</label><input type="number" step="any" id="f5" value="2.556"></div>
            <div class="input-group"><label>Latitude (Широта):</label><input type="number" step="any" id="f6" value="37.88"></div>
            <div class="input-group"><label>Longitude (Долгота):</label><input type="number" step="any" id="f7" value="-122.23"></div>

            <button type="submit">Рассчитать</button>
        </form>

        <div class="result" id="res">
            <p> Прогноз цены: <span id="price"></span></p>
            <p> Класс: <span id="category"></span> (<span id="prob"></span>%)</p>
        </div>
    </div>

    <script>
        document.getElementById('form').onsubmit = async (e) => {
            e.preventDefault();
            const formData = new URLSearchParams();
            for(let i=0; i<8; i++) {
                formData.append(`f${i}`, document.getElementById(`f${i}`).value);
            }

            const res = await fetch('/predict', { method: 'POST', body: formData });
            const data = await res.json();

            document.getElementById('price').innerText = `$${data.price.toLocaleString()}`;
            document.getElementById('category').innerText = data.class_label;
            document.getElementById('prob').innerText = data.probability;
            document.getElementById('res').style.display = 'block';
        };
    </script>
</body>
</html>
